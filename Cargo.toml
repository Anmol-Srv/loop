[package]
name = "acp-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "acp_server"
path = "src/lib.rs"

[[bin]]
name = "acp-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros",
] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"
sha2 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "charset", "http2"] }
eframe = { version = "0.36.2", optional = true }
egui_extras = { version = "0.36.2", features = ["image"], optional = true }
egui = { version = "0.36.2", optional = true }
argon2 = "0.6.0"
rpassword = "7.5.4"
egui-phosphor = { version = "0.14.0", features = ["thin"], optional = true }
egui-notify = { version = "0.23.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
tower-http = { version = "0.7.1", features = ["trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
image = "0.25.10"

[features]
# The desktop app's GUI stack is opt-in so the server binary's build stays lean.
#   cargo build --features app --bin acp-app
app = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:egui-phosphor", "dep:egui-notify", "dep:image"]

[[bin]]
name = "acp-app"
path = "src/bin/acp-app.rs"
required-features = ["app"]

# Symbols stripped from release builds: measured at 18% off both binaries
# (app 21.9 → 17.9 MB, server 10.8 → 9.0 MB) at no cost to build time. Not
# LTO — that would slow the rebuild after every change for a startup that is
# already well under budget.
[profile.release]
strip = true
